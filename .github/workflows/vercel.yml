name: Vercel CI/CD Deployment

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    name: 🧪 Run Verification & Automated Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Node Dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Node.js Test Suite (20/20 Verification)
        run: npm test

      - name: Run Python Test Suite (20/20 Verification)
        run: python3 backend_python/test_suite.py

      - name: Test Frontend Production Build
        run: npm run build

  deploy:
    name: 🚀 Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Pulling production environment..."
              vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            else
              echo "Pulling preview environment..."
              vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
            fi
          else
            echo "ℹ️ VERCEL_TOKEN / VERCEL_PROJECT_ID secret not configured in GitHub Secrets."
            echo "ℹ️ Note: If you connected this repository directly in the Vercel Dashboard (https://vercel.com/new), Vercel automatically deploys on every git push without requiring GitHub secrets!"
          fi

      - name: Build Project Artifacts with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              vercel build --prod --token=$VERCEL_TOKEN
            else
              vercel build --token=$VERCEL_TOKEN
            fi
          else
            echo "Running local build step..."
            npm run build
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🚀 Deploying to Production on Vercel..."
              vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
            else
              echo "🚀 Deploying Preview on Vercel..."
              vercel deploy --prebuilt --token=$VERCEL_TOKEN
            fi
          else
            echo "✅ Build verified successfully! Repository is 100% ready for Vercel."
          fi
